name: ANIMATE v0.7 engineering tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Preserve main/manual evidence; cancel only superseded runs of the same PR.
concurrency:
  group: animate-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    # Ubuntu 24.04 avoids Playwright's removed font dependencies on 26.04 runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate publish scope and repository hygiene
        run: python tests/check_release.py
      - name: Check JavaScript syntax
        run: node --check site/core.js && node --check site/foreground.js && node --check site/hand_ml.js && node --check site/app.js
      - name: Run core regression suite
        run: node tests/test_core.js && node tests/test_foreground.js && node tests/test_hand_ml.js
      - name: Audit runtime notice gate with malicious/adjacent-release fixtures
        run: python tests/test_runtime_rights.py
      - name: Test model-free preview and public-release fail-closed gates
        run: python tests/test_preview_release_guards.py
      - name: Audit HTTPS bench manifest, Host enforcement and security headers
        run: python tests/test_bench_https_security.py
      - name: Test hosted-preview zero-network access and asset integrity auditor
        run: python tests/test_hosted_preview_audit.py
      - name: Test entirely offline zero-charge private preview ZIP export
        run: python tests/test_zero_cost_preview.py
      - name: Test harmless offline host-authentication canary; do not deploy
        run: python tests/test_host_canary.py
      - name: Test screenshot isolation canary neutral homepage and private fake-marker route
        run: python tests/test_screenshot_isolation_canary.py
      - name: Test exact model-free operator preview ZIP, privacy and neutral-root gate
        run: python tests/test_operator_preview.py
      - name: Test source-verified Safari camera header/hash verification package
        run: python tests/test_iphone_camera_gate.py
      - name: Audit read-only Codespaces private preview static origin and rejection paths
        run: python tests/test_codespaces_private_preview.py
      - name: Adversarially audit self-reported iPhone evidence without personal data or uploads
        run: python tests/test_iphone_evidence.py
      - name: Cross-check real JavaScript evidence packets against Python audit contracts
        run: python tests/test_packet_contract.py
      - name: Synthetic recognition diagnostic (informational; not a real-device pass gate)
        run: node tests/recognition_matrix.js --summary
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright numpy
          python -m playwright install --with-deps chromium webkit
      - name: Run WebKit preflight (Linux engine, not iPhone Safari)
        run: python tests/test_webkit_smoke.py
      - name: Test model-free baseline preview over WebKit; do not upload/deploy
        run: |
          baseline_dir="$(mktemp -d "$RUNNER_TEMP/animate-noml.XXXXXX")"
          trap 'rm -rf -- "$baseline_dir"' EXIT
          python tools/build_baseline_preview.py --output "$baseline_dir/candidate"
          python tests/test_webkit_smoke.py --site-dir "$baseline_dir/candidate/site" --baseline
      - name: Exercise unbundled Netlify Free ZIP locally in WebKit, without deploying
        run: |
          preview_dir="$(mktemp -d "$RUNNER_TEMP/animate-nocharge.XXXXXX")"
          trap 'rm -rf -- "$preview_dir"' EXIT
          python tools/build_zero_cost_preview.py --output-dir "$preview_dir/preview"
          mkdir "$preview_dir/unpacked"
          python -m zipfile -e "$preview_dir/preview/animate-model-free-private-preview.zip" "$preview_dir/unpacked"
          python tests/test_webkit_smoke.py --site-dir "$preview_dir/unpacked" --baseline
      - name: Prepare source-verified operator ZIP and smoke-test nested URL in Linux WebKit
        run: |
          mkdir -p "$RUNNER_TEMP/animate-operator"
          python tools/build_operator_preview.py --output-dir "$RUNNER_TEMP/animate-operator/package"
          mkdir -p "$RUNNER_TEMP/animate-operator/unpacked"
          python -m zipfile -e "$RUNNER_TEMP/animate-operator/package/animate-operator-only-preview.zip" "$RUNNER_TEMP/animate-operator/unpacked"
          python tests/test_operator_preview_webkit.py --site-dir "$RUNNER_TEMP/animate-operator/unpacked"
          python tests/test_webkit_smoke.py --site-dir "$RUNNER_TEMP/animate-operator/unpacked/operator-preview" --baseline
      - name: Test authenticated Safari gate in Linux WebKit with changed-byte and missing-header faults
        run: |
          mkdir -p "$RUNNER_TEMP/animate-camera-gate"
          python tools/build_iphone_camera_gate.py --output-dir "$RUNNER_TEMP/animate-camera-gate/package"
          mkdir -p "$RUNNER_TEMP/animate-camera-gate/unpacked"
          python -m zipfile -e "$RUNNER_TEMP/animate-camera-gate/package/animate-verified-iphone-preview.zip" "$RUNNER_TEMP/animate-camera-gate/unpacked"
          python tests/test_iphone_camera_gate_webkit.py --site-dir "$RUNNER_TEMP/animate-camera-gate/unpacked"
      - name: Test same Codespaces static origin in local WebKit; no Codespace created
        run: python tests/test_codespaces_private_preview_webkit.py
      - name: Run offline browser regression suite
        run: python tests/offline_browser.py && python tests/test_hand_browser.py
      - name: Run synthetic camera browser suite over localhost
        run: python tests/e2e.py
      - name: Run real MediaPipe inference against pinned local test assets
        run: |
          assets_dir="$(mktemp -d "$RUNNER_TEMP/animate-assets.XXXXXX")"
          trap 'rm -rf -- "$assets_dir"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --max-time 60 \
            --output "$assets_dir/runtime.tgz" \
            https://registry.npmjs.org/@mediapipe/tasks-vision/-/tasks-vision-1.2.3.tgz
          curl --fail --silent --show-error --location --proto '=https' --max-time 60 \
            --output "$assets_dir/hand_landmarker.task" \
            'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task?generation=1682480004222387'
          curl --fail --silent --show-error --location --proto '=https' --max-time 60 \
            --output "$assets_dir/thumb_up.jpg" \
            'https://storage.googleapis.com/mediapipe-assets/tasks/testdata/vision/thumb_up.jpg?generation=1782185354353621'
          # This reports unresolved legal evidence rather than falsely claiming rights.
          # --expect-blocked succeeds only when the release gate remains blocked.
          python tools/audit_runtime_rights.py --runtime-archive "$assets_dir/runtime.tgz" --expect-blocked
          python tools/vendor_hand_model.py --stage-test --site-dir "$assets_dir/site" \
            --runtime-archive "$assets_dir/runtime.tgz" --model-file "$assets_dir/hand_landmarker.task"
          # Both engines consume the same SHA-256 pinned staged assets; no shipping bundle.
          python tests/test_real_hand_browser.py --site "$assets_dir/site" \
            --fixture "$assets_dir/thumb_up.jpg" --trials 1 --frames 6 --browser chromium
          python tests/test_real_hand_browser.py --site "$assets_dir/site" \
            --fixture "$assets_dir/thumb_up.jpg" --trials 1 --frames 6 --browser webkit
      # Public repository artifact: ONLY already-public, model-free UI assets.
      # It is an owner download candidate, never a hosting deployment or a secret.
      - name: Provide owner-downloadable operator preview ZIP (no deployment)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: animate-operator-preview-${{ github.sha }}
          path: ${{ runner.temp }}/animate-operator/package/animate-operator-only-preview.zip
          if-no-files-found: error
          retention-days: 3

      - name: Provide owner-downloadable Safari camera-gate ZIP (no deployment)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: animate-safari-camera-gate-${{ github.sha }}
          path: ${{ runner.temp }}/animate-camera-gate/package/animate-verified-iphone-preview.zip
          if-no-files-found: error
          retention-days: 3
